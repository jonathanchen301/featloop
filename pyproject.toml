[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featloop"
version = "0.1.0"
description = "Tiny offline feature store + MLflow retrain loop (portfolio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Chen" }]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "mlflow>=2.9,<3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
